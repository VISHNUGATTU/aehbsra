name: 24/7 Keep-Alive Cron Job

on:
  schedule:
    # Run every 10 minutes to prevent Render Free Tier from spinning down after 15 min inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard anytime

jobs:
  keep-alive:
    name: Ping Render Backend to Prevent Cold Boot
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vortex Power Backend Health Endpoint
        env:
          TARGET_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://vortex-power.onrender.com' }}
        run: |
          echo "=========================================================="
          echo "VORTEX POWER 24/7 KEEP-ALIVE CRON RUNNER"
          echo "Pinging target: ${TARGET_URL}/api/health"
          echo "Timestamp: $(date -u)"
          echo "=========================================================="
          
          # Ping the health endpoint
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${TARGET_URL}/api/health" || echo "ERR")
          echo "Health check HTTP response: ${HTTP_STATUS}"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "SUCCESS: Service is active, warm, and ready with 0 latency."
          else
            echo "WARNING: Service returned status ${HTTP_STATUS}. Sending wake-up ping to root..."
            curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${TARGET_URL}/" || true
            sleep 10
            RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${TARGET_URL}/api/health" || echo "ERR")
            echo "Retry response: ${RETRY_STATUS}"
          fi
          
          echo "Keep-alive execution finished."
